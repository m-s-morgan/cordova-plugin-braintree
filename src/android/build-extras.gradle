// Braintree Android SDK v5: only the modules PayPal and Venmo need (no drop-in, no 3DS, so no
// Cardinal repository).
dependencies {
    implementation 'com.braintreepayments.api:paypal:5.33.0'
    implementation 'com.braintreepayments.api:venmo:5.33.0'
    implementation 'com.braintreepayments.api:data-collector:5.33.0'
}
